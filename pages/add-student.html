<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
</head>
<body>

    <div id="navbar"></div>

<h1>Dashboard</h1>

<script>
fetch("components/navbar.html")
    .then(res => res.text())
    .then(data => {
        document.getElementById("navbar").innerHTML = data;
    });
</script>

    <h1>Add Student</h1>

    <form id="studentForm">

        <label>Student Code</label>
        <input
            type="text"
            id="student_code"
            required
        >

        <br><br>

        <label>Name</label>
        <input
            type="text"
            id="name"
            required
        >

        <br><br>

        <label>Class</label>
        <input
            type="text"
            id="class_name"
        >

        <br><br>

        <button type="submit">
            Save Student
        </button>

    </form>

    <script src="/js/students.js"></script>

</body>
</html>

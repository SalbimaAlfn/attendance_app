<!DOCTYPE html>
<html>
<head>
    <title>Import Students</title>
</head>
<body>


    <div id="navbar"></div>

<h1>Dashboard</h1>

<script>
fetch("components/navbar.html")
    .then(res => res.text())
    .then(data => {
        document.getElementById("navbar").innerHTML = data;
    });
</script>
<h1>Import Students</h1>

<form
    action="/import-student"
    method="POST"
    enctype="multipart/form-data"
>

    <input
        type="file"
        name="excelFile"
        accept=".xlsx,.xls"
        required
    >

    <button type="submit">
        Import
    </button>

</form>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>
<body>



    <div id="navbar"></div>

<h1>Dashboard</h1>

<script>
fetch("components/navbar.html")
    .then(res => res.text())
    .then(data => {
        document.getElementById("navbar").innerHTML = data;
    });
</script>
    <h1>Edit Student</h1>

    <form id="editForm">

        <label>Student Code</label>
        <br>
        <input
            type="text"
            id="student_code"
            readonly
        >

        <br><br>

        <label>Name</label>
        <br>
        <input
            type="text"
            id="name"
            required
        >

        <br><br>

        <label>Class</label>
        <br>
        <input
            type="text"
            id="class_name"
        >

        <br><br>

        <button type="submit">
            Update Student
        </button>

    </form>

    <br>

    <a href="/students">
        Back to Students
    </a>

    <script src="/js/edit-student.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">

<main class="auth-shell">
    <section class="auth-panel">
        <p class="eyebrow">Attendance System</p>
        <h1>Login</h1>
        <p class="auth-copy">
            Manage students, attendance scans, item status, and database tools from one dashboard.
        </p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>
    </section>
</main>

<script src="/js/login.js"></script>

</body>
</html>

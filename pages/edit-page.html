<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>
<body>

    <h1>Edit Student</h1>

    <form id="editForm">

        <label>Student Code</label>
        <br>
        <input
            type="text"
            id="student_code"
            readonly
        >

        <br><br>

        <label>Name</label>
        <br>
        <input
            type="text"
            id="name"
            required
        >

        <br><br>

        <label>Class</label>
        <br>
        <input
            type="text"
            id="class_name"
        >

        <br><br>

        <button type="submit">
            Update Student
        </button>

    </form>

    <script src="/js/edit-student.js"></script>

</body>
</html>

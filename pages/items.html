<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Types</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div id="navbar"></div>

    <h1>Item Types</h1>

    <form id="itemForm">

        <input
            type="text"
            id="item_name"
            placeholder="Item Name"
            required
        >

        <input
            type="text"
            id="description"
            placeholder="Description"
        >

        <button type="submit">
            Add Item
        </button>

        <button
    onclick="
        window.location.href=
        '/export-student-items'
    "
>
    Export Student Items
</button>

    </form>

    <br>

    <table border="1">

        <thead>
            <tr>
                <th>ID</th>
                <th>Item Name</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="itemTable">
        </tbody>

    </table>

    <script src="/js/layout.js"></script>
    <script src="/js/items.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
